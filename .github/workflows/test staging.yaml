name: Test staging build

on:
  push:
    branches: ["staging"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  STAGING_SERVER: localhost

jobs:
  playwright-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Creating .npmrc
        run: |
          cat > ~/.npmrc << EOF
            //npm.simsus.tech/:_authToken=$SIMSUSTECH_NPM_TOKEN
          EOF
        env:
          SIMSUSTECH_NPM_TOKEN: ${{ secrets.SIMSUSTECH_NPM_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: node_modules/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm i

      - name: Install playwright deps
        run: |
          cd packages/api
          pnpm exec playwright install --with-deps

      # The test stack is started by packages/api/tests/e2e/global-setup.ts,
      # which resets its volumes and builds both images. Only the external
      # `web` network (declared external by docker-compose.test.yaml) has to
      # exist before that, so a run never brings the stack up twice.
      - name: Prepare docker network
        run: |
          docker network inspect web >/dev/null 2>&1 || \
            docker network create web

      - name: Run Playwright tests (main)
        run: |
          pnpm run test:e2e
        env:
          # global-setup builds the images here, and compose reads this for its
          # build secret.
          SIMSUSTECH_NPM_TOKEN: ${{ secrets.SIMSUSTECH_NPM_TOKEN }}

      - name: Run Playwright guards
        run: |
          cd packages/api
          pnpm exec playwright test --config=playwright.guards.config.ts

      - name: Remove .npmrc
        run: rm ~/.npmrc

      - name: Stop Docker compose staging
        run: |
          docker compose -f docker-compose.test.yaml down
