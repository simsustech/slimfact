injectWorkspacePackages: true

packages:
  - packages/*
overrides:
  typescript: 6.0.3

minimumReleaseAge: 1440

minimumReleaseAgeExclude:

onlyBuiltDependencies:
  - "@parcel/watcher"
  - ejs
  - esbuild
  - sharp
  - simple-git-hooks

minimumReleaseAgeIgnoreMissingTime: true

allowBuilds:
  "@parcel/watcher": true
  ejs: true
  esbuild: true
  sharp: true
  simple-git-hooks: true
