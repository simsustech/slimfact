injectWorkspacePackages: true

packages:
  - packages/*
overrides:
  # Unpublished @modular-api/event-bus — local link until published to npm.simsus.tech.
  # The Docker build injects the same link: override in-build (LINKED_MODULAR_API_EVENT_BUS_PATH).
  "@modular-api/event-bus": "link:/home/stefan/Projects/modular-api/packages/event-bus"
  # typescript@7 removed the ./lib/tsc subpath that vue-tsc@3.3.9 needs — pin
  # the workspace to 6.0.3 so vue-tsc and the TS peer graph stay compatible.
  typescript: 6.0.3

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - browserslist
  - caniuse-lite
  - electron-to-chromium
  - "@vitrify/*"
  - vitrify
  - "@simsustech/quasar-components"
  - "@modular-api/*"
  - "@quasar/*"
  - vue-router
  - unocss-preset-quasar
  - oxfmt
  - "@oxfmt/*"
  - "@myriaddreamin/*"
  - "@oxlint/*"
  - oxlint
  - vite
  - axios
  - cronstrue
  - "@types/node"
  - cron-parser
  - pg-boss
  - stripe
  - "@unocss/*"
  - unocss
  - oidc-provider
  - quasar
  - sharp
  - "@img/*"
  - "@pinia/colada@1.4.2"
  - "@vue/compiler-core@3.5.40"
  - "@vue/compiler-dom@3.5.40"
  - "@vue/compiler-sfc@3.5.40"
  - "@vue/compiler-ssr@3.5.40"
  - "@vue/reactivity@3.5.40"
  - "@vue/runtime-core@3.5.40"
  - "@vue/runtime-dom@3.5.40"
  - "@vue/server-renderer@3.5.40"
  - "@vue/shared@3.5.40"
  - fast-xml-parser@5.10.1
  - vue@3.5.40
  - pinia@4.0.3
  - "@modular-api/fastify-checkout@0.9.1"
  - "@types/pg@8.20.4"
  - "@vue/compiler-core@3.5.41"
  - "@vue/compiler-dom@3.5.41"
  - "@vue/compiler-sfc@3.5.41"
  - "@vue/compiler-ssr@3.5.41"
  - "@vue/reactivity@3.5.41"
  - "@vue/runtime-core@3.5.41"
  - "@vue/runtime-dom@3.5.41"
  - "@vue/server-renderer@3.5.41"
  - "@vue/shared@3.5.41"
  - quasar@2.24.0
  - vue@3.5.41
  - unocss-preset-quasar@0.5.0 || 0.5.1 || 0.5.3 || 0.5.5
  - '@quasar/quasar-ui-qcalendar@5.2.2'
  - '@timestamp-js/core@1.0.0'
  - vitrify@0.27.0
  - export-to-csv@1.5.0
  - vite@8.2.2
  - '@types/oidc-provider@9.12.0'
  - beasties@0.5.3

onlyBuiltDependencies:
  - "@parcel/watcher"
  - ejs
  - esbuild
  - sharp
  - simple-git-hooks

minimumReleaseAgeIgnoreMissingTime: true

allowBuilds:
  "@parcel/watcher": true
  ejs: true
  esbuild: true
  sharp: true
  simple-git-hooks: true

