injectWorkspacePackages: true

packages:
  - packages/*

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - browserslist
  - caniuse-lite
  - electron-to-chromium
  - "@vitrify/*"
  - vitrify
  - "@simsustech/quasar-components"
  - "@modular-api/*"
  - "@quasar/*"
  - vue-router
  - unocss-preset-quasar
  - oxfmt
  - "@oxfmt/*"
  - "@myriaddreamin/*"
  - "@oxlint/*"
  - oxlint
  - vite
  - axios
  - cronstrue
  - '@types/node'
  - cron-parser
  - pg-boss
  - stripe
  - "@unocss/*"
  - unocss
  - oidc-provider
  - quasar
  - sharp
  - "@img/*"
  - '@types/node'

allowBuilds:
  "@parcel/watcher": true
  ejs: true
  esbuild: true
  sharp: true
  simple-git-hooks: true

minimumReleaseAgeIgnoreMissingTime: true
